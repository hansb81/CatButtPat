<style>
  :root {
    --bg: #f3e9da;
    --ink: #4a3b32;
    --ink-soft: #8a7566;
    --chip: rgba(255, 250, 242, 0.82);
    --chip-border: rgba(120, 90, 60, 0.15);
    --accent: #e98a8f;
    --vignette: rgba(90, 60, 30, 0.22);
    --panel: rgba(255, 251, 245, 0.88);
    --scrim: rgba(60, 40, 25, 0.35);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #2a2420;
      --ink: #f3e6d8;
      --ink-soft: #bba896;
      --chip: rgba(50, 42, 36, 0.8);
      --chip-border: rgba(255, 230, 200, 0.12);
      --panel: rgba(44, 37, 32, 0.88);
      --scrim: rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #2a2420; --ink: #f3e6d8; --ink-soft: #bba896;
    --chip: rgba(50, 42, 36, 0.8); --chip-border: rgba(255, 230, 200, 0.12); --panel: rgba(44, 37, 32, 0.88); --scrim: rgba(0, 0, 0, 0.5);
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: "Jua", system-ui, sans-serif; color: var(--ink); -webkit-tap-highlight-color: transparent; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; }
  [hidden] { display: none !important; }
  #vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 55%, var(--vignette) 100%); }
  #ui { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
  .top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .titleBox { background: var(--panel); border: 1px solid var(--chip-border); border-radius: 18px; padding: 10px 16px 12px; backdrop-filter: blur(8px); box-shadow: 0 4px 18px rgba(60, 40, 20, 0.12); max-width: 100%; box-sizing: border-box; }
  h1 { margin: 0; font-size: clamp(22px, 5vw, 32px); font-weight: 400; letter-spacing: -0.5px; }
  #nameBtn { pointer-events: auto; font: inherit; color: inherit; background: none; border: 0; border-bottom: 2px dashed var(--chip-border); padding: 0 2px; margin: 0; cursor: pointer; border-radius: 4px; }
  #nameBtn:hover, #nameBtn:focus-visible { border-bottom-color: var(--accent); outline: none; }
  #nameBtn::after { content: " ✎"; font-size: 0.55em; color: var(--ink-soft); vertical-align: middle; }
  #nameForm { pointer-events: auto; display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  #nameForm input { font: inherit; font-size: 17px; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--chip-border); background: var(--chip); color: var(--ink); width: min(50vw, 220px); min-width: 0; }
  #nameForm button { white-space: nowrap; flex-shrink: 0; font: inherit; font-size: 15px; padding: 8px 14px; border-radius: 999px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
  .hint { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
  #welcome { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: var(--scrim); padding: 24px; box-sizing: border-box; backdrop-filter: blur(3px); }
  .card { background: var(--panel); color: var(--ink); border-radius: 24px; padding: 28px 24px 22px; width: min(100%, 360px); box-shadow: 0 16px 50px rgba(40, 25, 10, 0.3); text-align: center; box-sizing: border-box; }
  .card .paw { font-size: 42px; line-height: 1; }
  .card h2 { margin: 10px 0 4px; font-size: 24px; font-weight: 400; }
  .card p { margin: 0 0 16px; font-size: 15px; color: var(--ink-soft); }
  .card input { font: inherit; font-size: 20px; text-align: center; width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--chip-border); background: var(--bg); color: var(--ink); }
  .card input:focus { outline: none; border-color: var(--accent); }
  .card .go { margin-top: 14px; width: 100%; font: inherit; font-size: 18px; padding: 12px; border-radius: 14px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
  .card .skip { margin-top: 10px; font: inherit; font-size: 14px; background: none; border: 0; color: var(--ink-soft); cursor: pointer; text-decoration: underline; }
  .coats { display: flex; gap: 10px; margin: 0 0 14px; }
  .coat { flex: 1; font: inherit; font-size: 16px; padding: 10px 6px; border-radius: 14px; border: 2px solid var(--chip-border); background: var(--bg); color: var(--ink); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .coat .sw { width: 38px; height: 38px; border-radius: 50%; box-shadow: inset 0 -6px 10px rgba(0,0,0,0.25); }
  .coat .sw.gray { background: radial-gradient(circle at 35% 30%, #7c7d87, #2a2a30 70%); }
  .coat .sw.cheese { background: repeating-linear-gradient(115deg, #e8a152 0 6px, #b8641c 6px 10px); }
  .coat .sw.cow { background: radial-gradient(circle at 30% 30%, #1d1d22 0 9px, transparent 10px), radial-gradient(circle at 75% 65%, #1d1d22 0 7px, transparent 8px), #f4f1ec; }
  .coats { gap: 8px; } .coat { font-size: 15px; padding: 10px 2px; }

  .bottom { display: flex; justify-content: center; }
  #count { background: var(--chip); border: 1px solid var(--chip-border); border-radius: 999px; padding: 10px 18px; font-size: 17px; backdrop-filter: blur(6px); transition: transform .12s; }
  #count.bump { transform: scale(1.12); }
  #mood { color: var(--accent); }

<body>
<div id="vignette"></div>
<div id="welcome" hidden>
  <form class="card" id="welcomeForm">
    <div class="paw">🐾</div>

      <button type="button" class="coat sel" data-coat="gray"><span class="sw gray"></span>회색냥이</button>
      <button type="button" class="coat" data-coat="cheese"><span class="sw cheese"></span>치즈냥이</button>

    </div>
    <input id="welcomeInput" type="text" maxlength="12" placeholder="예: 긍디" autocomplete="off" enterkeyhint="go">
    <button class="go" type="submit">시작하기</button><br>
    <button class="skip" type="button" id="welcomeSkip">나중에 지을래요</button>

</div>
<div id="ui">
  <div class="top">
    <div class="titleBox">
      <h1><button id="nameBtn" type="button" aria-label="고양이 이름 바꾸기">고양이</button> 궁디 팡팡</h1>
      <form id="nameForm" hidden>
        <label for="nameInput" class="sr-only" hidden>고양이 이름</label>
        <input id="nameInput" type="text" maxlength="12" placeholder="우리 고양이 이름" autocomplete="off" enterkeyhint="done">
        <button type="submit">저장</button>

    </div>

      <button class="chip" id="coatBtn" aria-label="고양이 종류 바꾸기">🐈 치즈냥이로</button>
      <button class="chip" id="mute" aria-label="소리 켜기/끄기">🔊 소리 켬</button>
    </div>
  </div>
  <div class="bottom"><div id="count">팡팡 <b id="n">0</b>번 · <span id="mood">새침함</span></div></div>
</div>
<script>
(function () {
function showError(msg) {
  let el = document.getElementById('err');
  if (!el) { el = document.createElement('div'); el.id = 'err'; el.style.cssText = 'position:fixed;left:16px;right:16px;top:40%;padding:14px;border-radius:14px;background:var(--chip);color:var(--ink);font-size:15px;text-align:center;z-index:9'; document.body.appendChild(el); }
  el.textContent = msg;
}
window.addEventListener('error', (e) => showError('앗, 고양이를 불러오지 못했어요: ' + (e.message || '알 수 없는 오류')));
if (!window.THREE) { showError('3D 엔진을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.'); return; }
const LOW = matchMedia('(pointer: coarse)').matches || Math.min(screen.width, screen.height) < 820;
const Q = LOW ? 0.55 : 1;           // fewer fur layers on phones
const SEG = LOW ? 0.6 : 1;          // lighter meshes on phones
const A2C = !location.search.includes('noa2c');

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, LOW ? 1.25 : 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);
renderer.domElement.style.touchAction = 'none';
renderer.domElement.addEventListener('webglcontextlost', (e) => { e.preventDefault(); showError('그래픽이 잠깐 끊겼어요. 새로고침해 주세요.'); });

const scene = new THREE.Scene();
{ // warm room backdrop with soft window light
  const c = document.createElement('canvas'); c.width = 64; c.height = 512;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, '#f7eee0'); gr.addColorStop(0.45, '#efe2cf'); gr.addColorStop(1, '#e3d2bb');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 512);
  const bg = new THREE.CanvasTexture(c); bg.colorSpace = THREE.SRGBColorSpace;
  scene.background = bg;
}
scene.fog = new THREE.Fog('#efe3d1', 9, 22);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
const camTarget = new THREE.Vector3(0.15, 0.62, -0.1);

const LIGHT_DIR = new THREE.Vector3(-0.45, 1.0, 0.55).normalize();
scene.add(new THREE.HemisphereLight('#fff6ea', '#b89a7a', 1.1));
const sun = new THREE.DirectionalLight('#fff1dc', 2.0);
sun.position.copy(LIGHT_DIR).multiplyScalar(8);
scene.add(sun);

// ---------- room ----------
const floor = new THREE.Mesh(new THREE.CircleGeometry(30, 64), new THREE.MeshStandardMaterial({ color: '#e8d9c3', roughness: 1 }));
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

// quilted blanket (yellow, like the photo)
function quiltTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#f4ecb8'; g.fillRect(0, 0, 512, 512);
  g.strokeStyle = 'rgba(190,170,100,0.35)'; g.lineWidth = 3;
  for (let i = -512; i < 1024; i += 48) {
    g.beginPath(); g.moveTo(i, 0); g.lineTo(i + 512, 512); g.stroke();
    g.beginPath(); g.moveTo(i, 512); g.lineTo(i + 512, 0); g.stroke();
  }
  for (let i = 0; i < 4000; i++) { g.fillStyle = `rgba(255,255,255,${Math.random() * 0.12})`; g.fillRect(Math.random() * 512, Math.random() * 512, 2, 2); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(4.5, 4.5); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const blanketGeo = new THREE.PlaneGeometry(11, 11, 100, 100);
{ // soft lumpy blanket
  const p = blanketGeo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i);
    const r = Math.hypot(x, y);
    p.setZ(i, 0.035 + 0.02 * Math.sin(x * 2.1) * Math.cos(y * 1.7));
  }
  blanketGeo.computeVertexNormals();
}
const blanket = new THREE.Mesh(blanketGeo, new THREE.MeshStandardMaterial({ map: quiltTexture(), roughness: 0.95 }));
blanket.rotation.x = -Math.PI / 2; blanket.rotation.z = 0.15;
scene.add(blanket);

// blob shadow
function shadowTex() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(128, 128, 10, 128, 128, 128);
  gr.addColorStop(0, 'rgba(50,32,16,0.85)'); gr.addColorStop(0.5, 'rgba(50,32,16,0.55)'); gr.addColorStop(0.8, 'rgba(60,40,20,0.12)'); gr.addColorStop(1, 'rgba(60,40,20,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
}
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 4.2), new THREE.MeshBasicMaterial({ map: shadowTex(), transparent: true, depthWrite: false, fog: false }));
shadow.rotation.x = -Math.PI / 2; shadow.position.set(0.15, 0.09, 0.05);
scene.add(shadow);

// ---------- fur shell shader ----------
const shared = {
  uTime: { value: 0 },
  uLightDir: { value: LIGHT_DIR },
  uLift: { value: 0 },
  uFlick: { value: 0 },
  uTailIdle: { value: 0 },
  uHit: { value: new THREE.Vector4(0, 0, 99, -10) },
  uBristle: { value: 0 },
  uBackDir: { value: new THREE.Vector3(0.35, 0.55, -0.75).normalize() },
};
const furVS = /* glsl */`
  uniform float uLayer, uLen, uTime, uLift, uFlick, uTailIdle, uComb, uRipple, uBristle;
  uniform vec4 uHit;
  uniform int uKind;
  attribute float aT;
  attribute vec3 aFlow;
  attribute float aLen;
  attribute float aCav;
  varying float vCav;
  varying vec3 vBase; varying vec3 vN; varying vec3 vW; varying float vT; varying vec3 vON; varying vec3 vFlow;
  float hashv(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
  float noisev(vec3 p){
    vec3 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
    return mix(mix(mix(hashv(i), hashv(i+vec3(1,0,0)), f.x), mix(hashv(i+vec3(0,1,0)), hashv(i+vec3(1,1,0)), f.x), f.y),
               mix(mix(hashv(i+vec3(0,0,1)), hashv(i+vec3(1,0,1)), f.x), mix(hashv(i+vec3(0,1,1)), hashv(i+vec3(1,1,1)), f.x), f.y), f.z);
  }
  void main(){
    vec3 p = position; vec3 n = normal;
    vBase = position; vT = aT; vON = normal; vCav = aCav;
    if (uKind == 0 && uRipple > 0.5) {   // body: "elevator butt"
      float r = smoothstep(-0.1, 1.35, p.z);
      p.y += uLift * r * r * 0.55;
      p.z += uLift * r * 0.08;
    }
    if (uKind == 2) {            // tail: flick + idle tip twitch
      float t = aT;
      p.x += (uFlick * 0.35 + uTailIdle * 0.12) * t * t;
      p.y += uFlick * 0.45 * t * t + uLift * 0.45 * (1.0 - t) * (1.0 - t) * (1.0 - t);
    }
    // fur ripple travelling out from where you patted
    float wave = 0.0;
    if (uRipple > 0.5) {
      float d = distance(position, uHit.xyz);
      float age = uTime - uHit.w;
      wave = step(0.0, age) * exp(-d * 2.2) * exp(-age * 2.6) * sin(d * 16.0 - age * 20.0);
      p += n * wave * 0.025;
    }
    // fur grows in soft tufts: the growth direction wanders with low-frequency noise,
    // tufts are longer or shorter, tips droop under their own weight and sway a little
    vec3 wob = vec3(noisev(position * 4.5), noisev(position * 4.5 + 11.3), noisev(position * 4.5 + 27.1)) - 0.5;
    vec3 flow = normalize(aFlow + wob * 0.9);
    float tuft = 0.78 + 0.5 * noisev(position * 3.2 + 5.0);
    float sway = sin(uTime * 1.6 + position.x * 3.0 + position.z * 2.0) * 0.5 + sin(uTime * 2.7 + position.y * 4.0) * 0.5;
    // when annoyed the fur stands on end: it follows the surface normal instead of lying flat, and gets longer
    float comb = uComb * (1.0 - 0.85 * uBristle);
    float shake = uBristle * sin(uTime * 38.0 + position.z * 9.0) * 0.08;
    vec3 dir = normalize(n * (1.0 + uBristle * 1.2) + (flow * (comb + wave * 0.9) + vec3(0.0, -0.18 * uLayer * (1.0 - uBristle), 0.0) + wob * 0.3 * uLayer) * uLayer + vec3(sway * 0.05 + shake, 0.0, sway * 0.03) * uLayer * uLayer);
    float puff = 1.0 + uBristle * (uKind == 2 ? 0.9 : 0.45);
    p += dir * uLen * aLen * tuft * uLayer * puff;
    vec4 w = modelMatrix * vec4(p, 1.0);
    vW = w.xyz;
    vN = normalize(mat3(modelMatrix) * n);
    vFlow = normalize(mat3(modelMatrix) * (flow + n * 0.001));
    gl_Position = projectionMatrix * viewMatrix * w;
  }`;
const furFS = /* glsl */`
  uniform float uLayer, uDensity;
  uniform int uKind;
  uniform vec3 uRoot, uTip, uWhite, uLightDir, uBackDir, uStripeCol, uBelly, uPatchCol;
  uniform float uStripe, uBellyAmt, uSock, uPatch;
  uniform vec4 uEyeL, uEyeR;
  varying vec3 vBase; varying vec3 vN; varying vec3 vW; varying float vT; varying vec3 vON; varying vec3 vFlow; varying float vCav;
  float hash(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
  float vnoise(vec3 p){
    vec3 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
    return mix(mix(mix(hash(i), hash(i+vec3(1,0,0)), f.x), mix(hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)), f.x), f.y),
               mix(mix(hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)), f.x), mix(hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)), f.x), f.y), f.z);
  }
  void main(){
    const mat3 R = mat3(0.7887, -0.2113, 0.5774, -0.2113, 0.7887, 0.5774, -0.5774, -0.5774, 0.5774);
    vec3 q = R * vBase * uDensity;
    vec3 cell = floor(q);
    float h = hash(cell);
    vec3 f = fract(q) - 0.5 + (vec3(hash(cell + 3.1), hash(cell + 7.7), hash(cell + 1.3)) - 0.5) * 0.5;
    vec3 on = normalize(R * vON);
    float rr = length(f - dot(f, on) * on);   // strand cross-section measured across the surface
    float alpha = 1.0;
    float tuft = vnoise(vBase * 3.2 + 5.0);                 // same tufts as the vertex shader
    if (uLayer > 0.0) {
      // strands in a thick tuft reach further; between tufts the coat thins out sooner
      float reach = uLayer * (1.0 - 0.3 * (tuft - 0.5));
      if (h < reach * 0.92 + 0.02) discard;
      float rad = (1.1 - uLayer) * 0.6;
      alpha = 1.0 - smoothstep(rad * 0.55, rad, rr);   // soft strand edges (alpha-to-coverage)
      alpha *= 1.0 - 0.55 * smoothstep(0.8, 1.0, uLayer); // tips fade out instead of ending abruptly
      if (alpha < 0.03) discard;
    }
    // eye openings on the head
    if (uKind == 1 && uLayer > 0.0) {
      if (distance(vBase.xy, uEyeL.xy) < uEyeL.w && vBase.z < 0.0) discard;
      if (distance(vBase.xy, uEyeR.xy) < uEyeR.w && vBase.z < 0.0) discard;
    }

    if (t > 0.9) r *= Math.sqrt(Math.max(0, 1 - ((t - 0.9) / 0.1) ** 2));
